name: Release RubyBikes
on:
  push:
    branches: [master]
    paths:
      - lib/rubybikes/version.rb
      - .github/workflows/release.yml
      - .github/scripts/configure_rubygems.rb
      - .github/scripts/release_version.rb
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rubygems-release
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: check
    if: github.repository == 'edumucelli/rubybikes' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Read version and check RubyGems
        id: version
        run: ruby .github/scripts/release_version.rb
      - name: Validate master ancestry and existing tag
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA" || {
              echo "Existing release tag points to a different commit"
              exit 1
            }
          fi
      - run: bundle exec rake build
        if: steps.version.outputs.publish == 'true'
      - run: ruby .github/scripts/package_smoke.rb
        if: steps.version.outputs.publish == 'true'
      # The public credential actions inspected during implementation do not yet
      # expose owner. Send the pending publisher's immutable owner explicitly.
      - name: Exchange OIDC token for owner 255571
        if: steps.version.outputs.publish == 'true'
        run: ruby .github/scripts/configure_rubygems.rb
      - name: Publish gem
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: gem push "pkg/rubybikes-$RELEASE_VERSION.gem"
      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: gh release create "$RELEASE_TAG" "pkg/rubybikes-$RELEASE_VERSION.gem" --target "$GITHUB_SHA" --generate-notes
