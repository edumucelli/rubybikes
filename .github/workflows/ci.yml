name: Native Ruby gem
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
        include:
          - os: macos-latest
            ruby: '3.4'
          - os: windows-latest
            ruby: '3.4'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: '2.6.9'
          bundler-cache: true
      - run: bundle exec rake test
        env:
          VERIFY_PROVIDER_COVERAGE: '1'
          COVERAGE: '1'
      - run: bundle exec rake build
      - name: Verify packaged installation
        run: ruby .github/scripts/package_smoke.rb
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.ruby == '3.4'
        with:
          name: ruby-coverage-and-gem
          path: |
            coverage/
            pkg/*.gem
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: gemfiles/quality.gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake lint typecheck
